# LSTM Luong + Unigram (Experiment 5)
# EN: BPE, VI: Unigram

model:
  name: "lstm_luong"
  embed_dim: 512
  hidden_dim: 512
  num_layers: 3
  encoder_layers: 3
  decoder_layers: 3
  dropout: 0.1
  attention_type: "general"

training:
  batch_size: 16
  num_epochs: 10
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "cosine"
  clip_grad_norm: 5.0
  warmup_steps: null
  eval_every: 1000
  save_every: 5000

data:
  sos_id: 1
  eos_id: 2
  pad_id: 0
  unk_id: 3

  source_level: "bpe"
  target_level: "unigram"
  tokenizer_type: null

  train_src: "dataset/vocabs/clean/train_end_clean.en"
  train_tgt: "dataset/vocabs/clean/train_end_clean.vi"
  dev_src:   "dataset/vocabs/clean/dev_end_clean.en"
  dev_tgt:   "dataset/vocabs/clean/dev_end_clean.vi"
  test_src:  "dataset/vocabs/clean/test_end_clean.en"
  test_tgt:  "dataset/vocabs/clean/test_end_clean.vi"

  vocab_json_train: "dataset/vocabs/clean/full_vocab.json"
  vocab_json_dev:   "dataset/vocabs/clean/full_vocab.json"
  vocab_json_test:  "dataset/vocabs/clean/full_vocab.json"

  min_count: 3
  vocab_size: 16000
  max_seq_len: 512

device: "cuda"
seed: 42
